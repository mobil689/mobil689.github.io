<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — Algorythms Society</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script src="https://unpkg.com/lenis@1.0.45/dist/lenis.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="dark:animated-gradient">
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>
    <div id="tsparticles"></div>

    <div id="header-root"></div>

    <main class="content-layer">
        <div class="page-hero">
            <h1 class="dark:text-white">Event Gallery</h1>
            <p class="text-violet-500 dark:text-violet-300 text-lg">Capturing the moments that define our community.</p>
        </div>

        <section class="subpage-section">
            <div class="container mx-auto px-6">
                <!-- Stats bar -->
                <div id="gallery-stats" class="flex justify-center gap-8 mb-8">
                    <div class="text-center">
                        <span id="total-count" class="text-3xl font-black dark:text-white">0</span>
                        <p class="text-sm dark:text-gray-400 mt-1">Total Photos</p>
                    </div>
                    <div class="w-px bg-gray-300 dark:bg-gray-700"></div>
                    <div class="text-center">
                        <span id="category-count" class="text-3xl font-black text-violet-500">0</span>
                        <p class="text-sm dark:text-gray-400 mt-1">Categories</p>
                    </div>
                </div>

                <!-- Filters -->
                <div class="gallery-filters" id="gallery-filters">
                    <!-- Generated dynamically -->
                </div>

                <!-- Gallery Grid -->
                <div class="pro-gallery-grid" id="gallery-grid">
                    <div class="col-span-full text-center py-20">
                        <div class="inline-block">
                            <svg class="animate-spin h-8 w-8 text-violet-500 mx-auto mb-4" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <p class="dark:text-gray-400">Loading gallery...</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Professional Lightbox -->
    <div class="pro-lightbox" id="pro-lightbox">
        <button class="lb-close" aria-label="Close">&times;</button>
        <button class="lb-btn lb-prev" aria-label="Previous">&#x2039;</button>
        <button class="lb-btn lb-next" aria-label="Next">&#x203A;</button>
        <div class="lightbox-counter" id="lb-counter">1 of 12</div>
        <img id="lb-image" src="" alt="Gallery image">
        <div class="lb-caption" id="lb-caption"></div>
    </div>

    <div id="footer-root"></div>

    <script src="shared.js"></script>
    <script src="components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            initComponents();
            initShared();
            gsap.registerPlugin(ScrollTrigger);

            // --- Gallery State ---
            let allImages = [];
            let visibleImages = [];
            let currentIndex = 0;

            // --- Lightbox Elements ---
            const lightbox = document.getElementById('pro-lightbox');
            const lbImage = document.getElementById('lb-image');
            const lbCaption = document.getElementById('lb-caption');
            const lbCounter = document.getElementById('lb-counter');

            // --- Fetch Gallery Data ---
            const query = `*[_type == "galleryImage"]{title, "imageUrl": image.asset->url, category}`;
            const images = await fetchSanityData(query);
            allImages = images;
            visibleImages = [...images];

            // --- Update Stats ---
            document.getElementById('total-count').textContent = images.length;
            const categories = [...new Set(images.map(i => i.category).filter(Boolean))];
            document.getElementById('category-count').textContent = categories.length;

            // --- Build Filters ---
            const filtersContainer = document.getElementById('gallery-filters');
            const categoryCounts = {};
            images.forEach(img => {
                const cat = (img.category || 'uncategorized').toLowerCase();
                categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
            });

            let filterHTML = `<button class="gallery-filter-btn active" data-filter="all">All <span class="filter-count">${images.length}</span></button>`;
            categories.forEach(cat => {
                const catLower = cat.toLowerCase();
                const catDisplay = cat.charAt(0).toUpperCase() + cat.slice(1);
                filterHTML += `<button class="gallery-filter-btn" data-filter="${catLower}">${catDisplay} <span class="filter-count">${categoryCounts[catLower] || 0}</span></button>`;
            });
            filtersContainer.innerHTML = filterHTML;

            // --- Build Gallery Grid ---
            const galleryGrid = document.getElementById('gallery-grid');

            if (images.length > 0) {
                galleryGrid.innerHTML = images.map((item, index) => {
                    // Every 5th image is featured (larger), every 3rd is tall
                    let sizeClass = '';
                    if (index % 7 === 0) sizeClass = 'featured';
                    else if (index % 5 === 0) sizeClass = 'tall';

                    const category = (item.category || 'uncategorized').toLowerCase();
                    const categoryDisplay = item.category ? item.category.charAt(0).toUpperCase() + item.category.slice(1) : '';

                    return `
                    <div class="gallery-item ${sizeClass}" data-category="${category}" data-index="${index}">
                        <img src="${item.imageUrl}?w=600&auto=format" alt="${item.title}" loading="lazy">
                        <div class="item-overlay">
                            <h4>${item.title}</h4>
                            ${categoryDisplay ? `<span class="item-category">${categoryDisplay}</span>` : ''}
                        </div>
                    </div>`;
                }).join('');

                // Stagger-in animation
                gsap.from(".gallery-item", {
                    y: 40,
                    opacity: 0,
                    duration: 0.6,
                    stagger: 0.08,
                    ease: "power3.out",
                    delay: 0.2
                });
            } else {
                galleryGrid.innerHTML = `
                <div class="col-span-full text-center py-20">
                    <div class="text-5xl mb-4">📸</div>
                    <h3 class="text-2xl font-bold dark:text-white mb-2">No Photos Yet</h3>
                    <p class="dark:text-gray-400">Gallery images will appear here once added to the CMS.</p>
                </div>`;
            }

            // --- Filter Click Handler ---
            filtersContainer.addEventListener('click', (e) => {
                const btn = e.target.closest('.gallery-filter-btn');
                if (!btn) return;

                filtersContainer.querySelector('.active').classList.remove('active');
                btn.classList.add('active');

                const filterValue = btn.getAttribute('data-filter');
                const allItems = document.querySelectorAll('.gallery-item');
                let newVisible = [];

                allItems.forEach(item => {
                    const cat = item.dataset.category;
                    if (cat === filterValue || filterValue === 'all') {
                        item.style.display = 'block';
                        gsap.to(item, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" });
                        newVisible.push(allImages[parseInt(item.dataset.index)]);
                    } else {
                        gsap.to(item, { opacity: 0, scale: 0.92, duration: 0.3, ease: "power2.in", onComplete: () => { item.style.display = 'none'; } });
                    }
                });

                visibleImages = newVisible;
            });

            // --- Lightbox Functions ---
            function openLightbox(index) {
                currentIndex = index;
                updateLightbox();
                lightbox.classList.add('active');
                if (lenis) lenis.stop();
            }

            function closeLightbox() {
                lightbox.classList.remove('active');
                if (lenis) lenis.start();
            }

            function updateLightbox() {
                const img = visibleImages[currentIndex];
                if (!img) return;
                gsap.to(lbImage, {
                    opacity: 0, duration: 0.15, onComplete: () => {
                        lbImage.src = `${img.imageUrl}?w=1600&auto=format`;
                        lbCaption.textContent = img.title;
                        lbCounter.textContent = `${currentIndex + 1} of ${visibleImages.length}`;
                        gsap.to(lbImage, { opacity: 1, duration: 0.15 });
                    }
                });
            }

            function nextImage() {
                if (visibleImages.length === 0) return;
                currentIndex = (currentIndex + 1) % visibleImages.length;
                updateLightbox();
            }

            function prevImage() {
                if (visibleImages.length === 0) return;
                currentIndex = (currentIndex - 1 + visibleImages.length) % visibleImages.length;
                updateLightbox();
            }

            // --- Lightbox Listeners ---
            galleryGrid.addEventListener('click', (e) => {
                const item = e.target.closest('.gallery-item');
                if (!item) return;
                const origIdx = parseInt(item.dataset.index);
                const visIdx = visibleImages.findIndex(img => img.imageUrl === allImages[origIdx].imageUrl);
                if (visIdx > -1) openLightbox(visIdx);
            });

            lightbox.querySelector('.lb-close').addEventListener('click', closeLightbox);
            lightbox.querySelector('.lb-prev').addEventListener('click', prevImage);
            lightbox.querySelector('.lb-next').addEventListener('click', nextImage);
            lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

            window.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('active')) return;
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextImage();
                if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevImage();
                if (e.key === 'Escape') closeLightbox();
            });
        });
    </script>
</body>
</html>
