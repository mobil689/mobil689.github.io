<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team — Algorythms Society</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script src="https://unpkg.com/lenis@1.0.45/dist/lenis.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="dark:animated-gradient">
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>
    <div id="tsparticles"></div>

    <div id="header-root"></div>

    <main class="content-layer">
        <div class="page-hero">
            <h1 class="dark:text-white">Meet The Team</h1>
            <p class="dark:text-gray-400 text-lg">The incredible people behind Algorythms.</p>
        </div>

        <section class="subpage-section">
            <div class="container mx-auto px-6">
                <!-- Executive Team -->
                <div class="mb-20">
                    <h3 class="section-title text-3xl font-bold dark:text-white text-center mb-4">Executive Team</h3>
                    <p class="text-center dark:text-gray-400 mb-12 text-lg">The leadership steering Algorythms' vision.</p>
                    <div id="executive-team-grid" class="flex flex-wrap gap-8 justify-center">
                        <p class="text-center dark:text-gray-400">Loading executive team...</p>
                    </div>
                </div>
                <!-- Core Team -->
                <div>
                    <h3 class="section-title text-3xl font-bold dark:text-white text-center mb-4">Core Team</h3>
                    <p class="text-center dark:text-gray-400 mb-12 text-lg">The powerhouse behind every event and initiative.</p>
                    <div id="core-team-grid" class="flex flex-wrap gap-8 justify-center">
                        <p class="text-center dark:text-gray-400">Loading core team...</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-root"></div>

    <script src="shared.js"></script>
    <script src="components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            initComponents();
            initShared();
            gsap.registerPlugin(ScrollTrigger);

            // Render team
            const executiveGrid = document.getElementById('executive-team-grid');
            const coreGrid = document.getElementById('core-team-grid');
            const query = `*[_type == "teamMember"] | order(order asc){name, role, linkedin, instagram, "imageUrl": image.asset->url, isDepartmentHead, department, isCoreTeam, pokemonImg, order}`;
            const members = await fetchSanityData(query);

            if (members.length === 0) {
                executiveGrid.innerHTML = '<p class="text-center dark:text-gray-400">No team members found. Add some in your Sanity Studio!</p>';
                coreGrid.innerHTML = '';
                return;
            }

            // isCoreTeam flag = Executive Team members
            const executiveTeam = members.filter(m => m.isCoreTeam);
            // isDepartmentHead flag = Core Team members
            const coreTeam = members.filter(m => m.isDepartmentHead);

            executiveGrid.innerHTML = executiveTeam.map(member => createDynamicFlipCard(member)).join('');
            coreGrid.innerHTML = coreTeam.map(member => createDynamicFlipCard(member)).join('');

            // Animate cards in
            gsap.from(".flip-card", {
                scrollTrigger: { trigger: ".flip-card", start: "top 70%" },
                scale: 0.5, opacity: 0, duration: 0.8, ease: "back.out(1.5)", stagger: 0.05
            });
        });
    </script>
</body>
</html>
